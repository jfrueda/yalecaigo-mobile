name: gowith
description: GoWith, aplicación de acompañamiento seguro desarrollada por Opentic.
publish_to: none
version: 1.1.0+18
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.0.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_facebook_auth: 7.1.5
  flutter_map: ^7.0.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
